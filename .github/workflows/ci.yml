name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # PostgreSQL p/ testes de integração da API quando os serviços precisarem
    # de banco (hoje os testes são unit/inject sem DB).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: origem
          POSTGRES_PASSWORD: origem
          POSTGRES_DB: origem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U origem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (unit e integração)
        run: npm test
        env:
          DATABASE_URL: postgresql://origem:origem@localhost:5432/origem_test?schema=public

      - name: Build
        run: npm run build